[project]
name = "ksj-n07-bus-route-greater-tokyo"
version = "0.1.0"
description = "Reproducible collection of the bus routes (国土数値情報 N07, 2022) of Saitama, Chiba, Tokyo and Kanagawa"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "pyarrow>=26.0.0",
    "pyproj>=3.7.0",
    "shapely>=2.1.0",
]

[dependency-groups]
dev = ["pyshp>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
